name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [android-native]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      VITE_API_URL: https://white-account-backend.onrender.com/api
      CARGO_BUILD_JOBS: '2'
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      NDK_HOME: ${{ github.workspace }}/.android-sdk/ndk/27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Android SDK and NDK
        run: |
          bash scripts/android-ci.sh bash scripts/setup-android-sdk.sh
      - run: npm ci
      - name: Validate application configuration
        run: npm run release:check && npm run security:check && npm run android:check
      - name: Generate Android project
        run: bash scripts/android-ci.sh npm run tauri -- android init --ci --skip-targets-install
      - name: Apply White Account launcher icons
        run: npm run android:icons
      - name: Build installable ARM64 test APK
        run: bash scripts/android-ci.sh npm run tauri -- android build --debug --apk --target aarch64 --ci
      - name: Verify and collect APK
        run: |
          mkdir -p android-artifacts
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk')
          test "${#apks[@]}" -eq 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "${apks[0]}"
          cp "${apks[0]}" android-artifacts/White-Account-Android-arm64-test.apk
          sha256sum android-artifacts/*.apk > android-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: White-Account-Android-arm64-test
          path: android-artifacts/
          if-no-files-found: error
          retention-days: 30
